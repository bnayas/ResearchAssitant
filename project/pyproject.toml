[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-platform"
version = "0.1.0"
description = "Multi-agent scientific simulation and research platform"
requires-python = ">=3.11"

dependencies = [
    "beautifulsoup4>=4.14.3",
]          # stdlib only for sim_tool core

[project.optional-dependencies]
anthropic  = ["anthropic>=0.28"]
openai     = ["openai>=1.0"]
literature = ["aiohttp>=3.9"]
api        = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
full       = ["anthropic>=0.28", "openai>=1.0", "aiohttp>=3.9",
              "numpy", "scipy", "pandas", "matplotlib"]
dev        = ["pytest>=7", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sim_tool*", "literature_review*", "reviewer*", "writer*", "research_platform*", "comms*"]

[tool.pytest.ini_options]
testpaths   = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*.test.js"]

[dependency-groups]
dev = ["pytest>=7", "pytest-asyncio"]
